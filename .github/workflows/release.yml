name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - rid: win-x64
            binary: gizmo.exe
          - rid: osx-x64
            binary: gizmo
          - rid: osx-arm64
            binary: gizmo
          - rid: linux-x64
            binary: gizmo
          - rid: linux-arm64
            binary: gizmo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/Gizmo/Gizmo/Gizmo.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            --output ./publish/${{ matrix.rid }}

      - name: Rename binary
        run: |
          cd ./publish/${{ matrix.rid }}
          find . -maxdepth 1 -type f ! -name "*.pdb" | head -1 | xargs -I {} mv {} ${{ matrix.binary }}

      - name: Create archive
        run: |
          cd ./publish/${{ matrix.rid }}
          zip ../../gizmo-${{ github.ref_name }}-${{ matrix.rid }}.zip ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ./gizmo-${{ github.ref_name }}-${{ matrix.rid }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GIZMO ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: ./artifacts/*.zip
